name : CI/CD Pipeline PMVL API

#Le pipeline se déclenche à chaque push sur la branche main or test
on:
  push:
    branches:
      - main
      - test
jobs:
  #Job 1: Exécuter les tests Pytest
  test-api:
    name: Run Pytest
    runs-on: ubuntu-latest
    steps:
      - name : Checkout code
        uses: actions/checkout@v4

      - name : Configuration de Python
        uses : actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip' #Cache les dépendances pip pour accélérer les builds futurs
      - name : Installation des dépendances
        run : |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name : Execution des tests automatisés
        run : |
          pytest
  #Job 2: Verifier que l'image Docker est construite correctement
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test-api #Ce job ne s'exécute que si le job de test réussit
    steps:
      - name : Checkout code
        uses: actions/checkout@v4

      - name : Construction de l'image Docker
        run : |
          docker build -t pmvl-api:latest .

  #Job 3 : deploiement sur hugingface
  deploy-to-hf:
    name: Deploy to Hugging Face Space
    runs-on: ubuntu-latest
    needs: build-docker  # ne se lance que si tests + build Docker OK

    steps:
      - name: Checkout du repo GitHub
        uses: actions/checkout@v4

      - name: Configurer Git
        run: |
          git config --global user.email "bravocastanedajose@gmail.com"
          git config --global user.name "JoseBravo26 (CI)"

      - name: Cloner le Space Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone https://user:$HF_TOKEN@huggingface.co/spaces/josibra/pmvl-prediction-api hf_space

      - name: Copier les fichiers du projet vers le Space
        run: |
          # 1. On crée l'arborescence cible
          mkdir -p hf_space/app hf_space/models hf_space/tests
          
          # 2. On copie uniquement les fichiers/dossiers nécessaires
          cp -r app/* hf_space/app/
          cp -r models/* hf_space/models/
          cp -r tests/* hf_space/tests/
          cp requirements.txt hf_space/
          cp Dockerfile hf_space/

      - name: Commit & push vers Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd hf_space
          
          # 1. Empêcher la copie des fichiers de cache Python (inutiles en prod)
          find . -name "*.pyc" -delete
          find . -type d -name "__pycache__" -exec rm -r {} +
          
          # 2. Configurer Git LFS pour les fichiers CatBoost
          git lfs install
          git lfs track "*.cbm"
          
          # 3. Ajouter les fichiers
          git add .gitattributes
          git add .
          
          if git diff --cached --quiet; then
            echo "Aucun changement à déployer."
          else
            git commit -m "Déploiement auto depuis GitHub Actions avec LFS"
            git push https://user:$HF_TOKEN@huggingface.co/spaces/josibra/pmvl-prediction-api
          fi